<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!--
    Oasis Cognition mark: three concentric arcs (oasis ripples) emanating from a central
    node (cognition core). Gradient blue→emerald = water + life. Top half of each ring is
    open so the silhouette reads as motion / pulse rather than a closed boundary.
  -->
  <defs>
    <linearGradient id="oc-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="55%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <radialGradient id="oc-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#10b981"/>
    </radialGradient>
  </defs>

  <!-- Outer ripple -->
  <path d="M 6 38 A 26 26 0 1 1 58 38" stroke="url(#oc-grad)" stroke-width="3" stroke-linecap="round" stroke-opacity="0.55"/>
  <!-- Middle ripple -->
  <path d="M 14 38 A 18 18 0 1 1 50 38" stroke="url(#oc-grad)" stroke-width="3" stroke-linecap="round" stroke-opacity="0.8"/>
  <!-- Inner ripple -->
  <path d="M 22 38 A 10 10 0 1 1 42 38" stroke="url(#oc-grad)" stroke-width="3" stroke-linecap="round"/>

  <!-- Cognition core -->
  <circle cx="32" cy="38" r="4.5" fill="url(#oc-core)"/>

  <!-- Pulse base — short horizontal stroke that grounds the ripples and reads as a horizon -->
  <line x1="6" y1="48" x2="58" y2="48" stroke="url(#oc-grad)" stroke-width="2" stroke-linecap="round" stroke-opacity="0.35"/>
</svg>
