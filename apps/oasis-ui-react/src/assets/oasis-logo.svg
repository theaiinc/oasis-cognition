<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" fill="none">
  <!--
    Oasis Cognition — horizontal lockup, sized so the wordmark stays legible
    when rendered at ~h-10 / h-11 in the chat header. ViewBox is shorter (56
    instead of 64) so text takes up more of the vertical budget after CSS
    scale-down.
  -->
  <defs>
    <linearGradient id="oc-lockup-grad" x1="0" y1="0" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="55%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <radialGradient id="oc-lockup-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#10b981"/>
    </radialGradient>
  </defs>

  <!-- Mark (centered in a 56×56 box, slightly smaller than viewBox so it doesn't dominate) -->
  <g transform="translate(4, 4)">
    <path d="M 4 32 A 22 22 0 1 1 52 32" stroke="url(#oc-lockup-grad)" stroke-width="3" stroke-linecap="round" stroke-opacity="0.55" fill="none"/>
    <path d="M 11 32 A 15 15 0 1 1 45 32" stroke="url(#oc-lockup-grad)" stroke-width="3" stroke-linecap="round" stroke-opacity="0.85" fill="none"/>
    <path d="M 18 32 A 8 8 0 1 1 38 32" stroke="url(#oc-lockup-grad)" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="28" cy="32" r="4" fill="url(#oc-lockup-core)"/>
    <line x1="4" y1="42" x2="52" y2="42" stroke="url(#oc-lockup-grad)" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.35"/>
  </g>

  <!-- Wordmark, sized for readability after CSS scaling -->
  <text x="68" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#e2e8f0" letter-spacing="-0.4">Oasis</text>
  <text x="68" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="2">COGNITION</text>
</svg>
